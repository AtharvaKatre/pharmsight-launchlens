services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pharmsight
      POSTGRES_PASSWORD: pharmsight
      POSTGRES_DB: pharmsight
    ports:
      # Override the host port if 5432 is taken, e.g. PHARMSIGHT_DB_PORT=5434
      - "${PHARMSIGHT_DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmsight -d pharmsight"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
