# Render Blueprint: New > Blueprint > select this repo.
# Creates one Docker web service (API + React build) and a PostgreSQL database, both on the free plan.
services:
  - type: web
    name: pharmsight
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pharmsight-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"

databases:
  - name: pharmsight-db
    plan: free
    databaseName: pharmsight
    user: pharmsight
    postgresMajorVersion: "16"
